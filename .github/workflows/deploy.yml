name: Deploy to GoDaddy cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Trigger cPanel Git Pull

    steps:
      - name: Trigger cPanel Git pull via webhook
        run: |
          curl -s -X GET "${{ secrets.CPANEL_GIT_WEBHOOK_URL }}" \
            --max-time 30 \
            -w "\nHTTP Status: %{http_code}\n"
