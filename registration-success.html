<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Confirmed &mdash; Fitness Conscious Goa</title>
    <link rel="icon" type="image/jpeg" href="favicon/favicon.jpeg">
    <link rel="shortcut icon" type="image/jpeg" href="favicon/favicon.jpeg">
    <link rel="icon" type="image/jpeg" href="favicon/favicon.jpeg">
    <link rel="shortcut icon" type="image/jpeg" href="favicon/favicon.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        (function() {
            const t = localStorage.getItem('theme') || 'light';
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }

        .thankyou-page {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 5rem 1rem 1.5rem;
            background: var(--background-color);
        }

        .thankyou-card {
            background: var(--card-background);
            border-radius: 20px;
            padding: 1.75rem 2rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 10px 40px var(--shadow-medium);
            border: 1px solid var(--border-color);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .thankyou-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(135deg, #FF4444, #FF6B35);
        }

        .thankyou-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.75rem;
            font-size: 1.4rem;
            color: #fff;
            box-shadow: 0 6px 20px rgba(22,163,74,0.35);
        }

        .thankyou-card h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .thankyou-card .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .thankyou-message {
            background: var(--background-color);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            text-align: left;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .thankyou-message p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }

        .thankyou-message p:last-child { margin-bottom: 0; }
        .highlight { color: var(--text-primary); font-weight: 600; }

        .event-details-box {
            background: rgba(255,68,68,0.05);
            border: 1px solid rgba(255,68,68,0.15);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            text-align: left;
        }

        [data-theme="dark"] .event-details-box { background: rgba(255,68,68,0.1); }

        .event-details-box .detail-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
            padding: 0.2rem 0;
        }

        .event-details-box i { color: #FF6B35; width: 14px; font-size: 0.75rem; }

        .bib-note {
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: var(--background-color);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            border: 1px dashed var(--border-color);
            margin-top: 0.5rem;
        }

        .tagline {
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: #FF6B35;
            letter-spacing: 0.05em;
            margin-top: 0.5rem;
        }

        .email-note {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .email-note i { color: #FF6B35; }

        .thankyou-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .thankyou-actions a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.1rem;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .btn-home { background: linear-gradient(135deg,#FF4444,#FF6B35); color:#fff; box-shadow:0 4px 15px rgba(255,68,68,0.3); }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,68,68,0.4); }
        .btn-events, .btn-register-again { background: transparent; color: var(--text-primary); border: 1.5px solid var(--border-color); }
        .btn-events:hover, .btn-register-again:hover { border-color: #FF4444; color: #FF4444; }

        @media (max-width: 480px) {
            .thankyou-card { padding: 1.25rem 1rem; }
            .thankyou-actions { flex-direction: column; }
            .thankyou-actions a { justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="nav-container"></div>

    <main class="thankyou-page">
        <div class="thankyou-card">
            <div class="thankyou-icon"><i class="fas fa-check"></i></div>
            <h1>Registration Confirmed!</h1>
            <p class="subtitle" id="successSubtitle">Thank you for registering!</p>

            <div class="thankyou-message">
                <p>Your registration has been <span class="highlight">successfully confirmed</span>. 🎉</p>

                <div class="event-details-box">
                    <div class="detail-row"><i class="fas fa-running"></i> <strong id="successEventTitle">Loading...</strong></div>
                    <div class="detail-row" id="successDateRow" style="display:none;"><i class="fas fa-calendar-alt"></i> <span id="successDate"></span></div>
                    <div class="detail-row" id="successLocationRow" style="display:none;"><i class="fas fa-map-marker-alt"></i> <span id="successLocation"></span></div>
                    <div class="detail-row" id="successTimeRow" style="display:none;"><i class="fas fa-clock"></i> <span id="successTime"></span></div>
                </div>

                <div class="bib-note">
                    <i class="fas fa-info-circle" style="color:#FF6B35;margin-right:6px;"></i>
                    BIB &amp; event details will be shared separately. Confirmation email sent.
                </div>

                <p class="tagline" style="margin-top:0.5rem;">Run &bull; Stay Fit &bull; Stay Healthy!</p>
            </div>

            <div class="thankyou-actions">
                <a href="index.html" class="btn-home"><i class="fas fa-home"></i> Home</a>
                <a href="events.html" class="btn-events"><i class="fas fa-calendar-alt"></i> All Events</a>
                <a href="events.html" class="btn-register-again" id="registerAgainBtn"><i class="fas fa-redo"></i> Register Again</a>
            </div>
        </div>
    </main>

    <script src="src/nav-simple.js"></script>
    <script>
        const params  = new URLSearchParams(window.location.search);
        const eventId = params.get('event');

        // Register Again button
        const btn = document.getElementById('registerAgainBtn');
        if (eventId && btn) btn.href = 'event-registration.html?event=' + eventId;

        // Fetch real event details
        if (eventId) {
            fetch('api/events/get-events.php')
                .then(r => r.json())
                .then(data => {
                    if (!data.success || !data.data) return;
                    const event = data.data.find(e => String(e.id) === String(eventId));
                    if (!event) return;

                    document.getElementById('successSubtitle').textContent =
                        'Thank you for registering for ' + event.title + '!';

                    ['successEventTitle', 'successEventTitleFooter'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.textContent = event.title;
                    });

                    if (event.formatted_date) {
                        document.getElementById('successDate').textContent = event.formatted_date;
                        document.getElementById('successDateRow').style.display = 'flex';
                    }
                    if (event.location) {
                        document.getElementById('successLocation').textContent = event.location;
                        document.getElementById('successLocationRow').style.display = 'flex';
                    }
                    if (event.formatted_time) {
                        document.getElementById('successTime').textContent = event.formatted_time;
                        document.getElementById('successTimeRow').style.display = 'flex';
                    }
                })
                .catch(() => {
                    const el = document.getElementById('successEventTitle');
                    if (el) el.textContent = 'your event';
                });
        } else {
            const el = document.getElementById('successEventTitle');
            if (el) el.textContent = 'your event';
        }
    </script>
</body>
</html>
